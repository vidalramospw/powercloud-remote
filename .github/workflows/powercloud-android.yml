# PowerCloud Remote: compilacion Android (APK arm64) con la marca PowerCloud.
# Basado en el job build-rustdesk-android de flutter-build.yml (RustDesk 1.5.1).
# Firma: si existen los secretos ANDROID_SIGNING_KEY / ANDROID_ALIAS / ANDROID_KEY_STORE_PASSWORD /
# ANDROID_KEY_PASSWORD, gradle firma el APK y el AAB (Google Play) con la llave de subida de PowerCloud;
# si no, quedan con la llave de prueba (sirven para instalar a mano, no para la tienda).
# versionCode = 2000 + numero de compilacion (siempre creciente, lo exige Play).
name: PowerCloud Remote - Android

on:
  workflow_dispatch:
  push:
    tags:
      - "pc-*"

env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  NDK_VERSION: "r28c"
  VERSION: "1.5.1"
  PC_BUILD: ${{ github.run_number }}
  PC_VERSION: "1.5.1.${{ github.run_number }}"
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-android:
    name: Android arm64
    needs: [generate-bridge]
    runs-on: ubuntu-24.04
    env:
      TARGET: aarch64-linux-android
      ABI: arm64-v8a
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib git g++ g++-multilib \
               libayatana-appindicator3-dev libasound2-dev libc6-dev libclang-dev libunwind-dev \
               libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libpulse-dev \
               libva-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev \
               libxfixes-dev llvm-dev nasm ninja-build openjdk-17-jdk-headless pkg-config tree wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Aplicar marca PowerCloud
        run: python3 powercloud/aplicar_marca.py

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! ./flutter/build_android_deps.sh "${ABI}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "$f:"; cat "$f"; done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: powercloud-android
          key: ${{ env.TARGET }}

      - name: Build rust lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${TARGET}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh

      - name: Build APK y AAB
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          PC_VERSION_CODE=$((2000 + PC_BUILD))
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          if [ -n "$ANDROID_SIGNING_KEY" ]; then
            # Llave de subida de PowerCloud (fuera del repositorio; se borra al terminar el job).
            echo "$ANDROID_SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/powercloud-upload.p12"
            {
              echo "storeFile=$RUNNER_TEMP/powercloud-upload.p12"
              echo "storePassword=$ANDROID_KEY_STORE_PASSWORD"
              echo "keyAlias=$ANDROID_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > ./flutter/android/key.properties
          else
            sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          fi
          mkdir -p ./flutter/android/app/src/main/jniLibs/${ABI}
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/${ABI}/
          cp ./target/${TARGET}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/${ABI}/librustdesk.so
          pushd flutter
          flutter build apk --release --target-platform android-arm64 --split-per-abi --build-name=1.5.1 --build-number=${PC_VERSION_CODE}
          flutter build appbundle --release --target-platform android-arm64 --build-name=1.5.1 --build-number=${PC_VERSION_CODE}
          popd
          rm -f ./flutter/android/key.properties "$RUNNER_TEMP/powercloud-upload.p12"
          mkdir -p salida
          mv flutter/build/app/outputs/flutter-apk/app-${ABI}-release.apk salida/PowerCloudRemote-${PC_VERSION}-arm64.apk
          mv flutter/build/app/outputs/bundle/release/app-release.aab salida/PowerCloudRemote-${PC_VERSION}.aab

      - name: Subir APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: powercloud-remote-android-arm64
          path: salida/PowerCloudRemote-${{ env.PC_VERSION }}-arm64.apk
          if-no-files-found: error

      - name: Subir AAB (Google Play)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: powercloud-remote-android-aab
          path: salida/PowerCloudRemote-${{ env.PC_VERSION }}.aab
          if-no-files-found: error
